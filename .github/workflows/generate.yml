name: Generate daily post idea

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST daily (UTC+5:30) — adjust as needed
  workflow_dispatch: {}      # lets you trigger it manually from GitHub's Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post + notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_and_notify.py

      - name: Commit draft + state
        run: |
          git config user.name "ig-ai-bot"
          git config user.email "actions@github.com"
          git add draft.json state.json posts/
          git commit -m "New draft post for review" || echo "Nothing to commit"
          git push
