name: Generate daily post idea

on:
  schedule:
    - cron: "0 3 * * *"    # 8:30 AM IST
    - cron: "0 15 * * *"   # 8:30 PM IST
  workflow_dispatch: {}      # lets you trigger it manually from GitHub's Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post + notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_and_notify.py

      - name: Commit draft + state + image
        run: |
          git config user.name "ig-ai-bot"
          git config user.email "actions@github.com"
          git add drafts.json state.json posts/
          git commit -m "New draft post for review" || echo "Nothing to commit"
          git push