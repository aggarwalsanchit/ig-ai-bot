name: 🧪 Test - Single Image

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category (or leave empty for random)'
        required: false
        default: ''
        type: string

jobs:
  test-single-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Single Image Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TEST_CATEGORY: ${{ inputs.category }}
        run: |
          echo "🖼️ Testing Single Image Post..."
          echo "📂 Category: ${TEST_CATEGORY:-Random}"
          python scripts/test_single_image.py
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-single-image-output
          path: |
            posts/single/*.png
            test_single_image_draft.json
            *.png
          retention-days: 7
      
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🧪 Test: Single Image $(date +'%Y-%m-%d %H:%M')"
          git push || echo "No changes to push"